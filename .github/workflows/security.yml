name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Guard against tracked credentials
        run: node scripts/check-tracked-credentials.mjs
      - run: npm ci
      - name: Audit all dependency scopes
        run: npm audit --audit-level=high
      - name: Run security and regression tests
        run: npm test
  codeql:
    # Private repositories need GitHub Code Security entitlement and this opt-in variable.
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
