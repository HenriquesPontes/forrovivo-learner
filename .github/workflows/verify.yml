name: Verify ForroVivo Learner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          LEARN_ORIGIN: http://127.0.0.1:3000
          API_ORIGIN: https://api-staging.forrovivo.com
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ""
          NEXT_PUBLIC_APPLE_WEB_CLIENT_ID: ""
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Browser and HTTP contract checks
        run: npm run test:e2e
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learner-browser-results
          path: test-results/
          if-no-files-found: ignore
